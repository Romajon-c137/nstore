openapi: 3.0.3
info:
  title: Nstore API
  version: 1.0.0
paths:
  /api/v1/auth/addresses/:
    get:
      operationId: v1_auth_addresses_list
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAddressList'
          description: ''
    post:
      operationId: v1_auth_addresses_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Address'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Address'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Address'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'
          description: ''
  /api/v1/auth/addresses/{id}/:
    get:
      operationId: v1_auth_addresses_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'
          description: ''
    put:
      operationId: v1_auth_addresses_update
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Address'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Address'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Address'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'
          description: ''
    patch:
      operationId: v1_auth_addresses_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAddress'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAddress'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAddress'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'
          description: ''
    delete:
      operationId: v1_auth_addresses_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/auth/csrf/:
    get:
      operationId: v1_auth_csrf_retrieve
      tags:
      - v1
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Csrf'
          description: ''
  /api/v1/auth/login/:
    post:
      operationId: v1_auth_login_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Login'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Login'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Login'
          description: ''
  /api/v1/auth/logout/:
    post:
      operationId: v1_auth_logout_create
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/auth/me/:
    get:
      operationId: v1_auth_me_retrieve
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/v1/auth/register/:
    post:
      operationId: v1_auth_register_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Register'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Register'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Register'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Register'
          description: ''
  /api/v1/catalog/categories/:
    get:
      operationId: v1_catalog_categories_list
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - v1
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
          description: ''
  /api/v1/catalog/products/:
    get:
      operationId: v1_catalog_products_list
      parameters:
      - in: query
        name: brand
        schema:
          type: string
      - in: query
        name: brand__in
        schema:
          type: array
          items:
            type: string
        description: Несколько значений могут быть разделены запятыми.
        explode: false
        style: form
      - in: query
        name: category__slug
        schema:
          type: string
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: variants__sku
        schema:
          type: string
      tags:
      - v1
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProductListList'
          description: ''
  /api/v1/catalog/products/{slug}/:
    get:
      operationId: v1_catalog_products_retrieve
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - v1
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDetail'
          description: ''
  /api/v1/checkout/:
    post:
      operationId: v1_checkout_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Checkout'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Checkout'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Checkout'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Checkout'
          description: ''
  /api/v1/health/:
    get:
      operationId: v1_health_retrieve
      tags:
      - v1
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
          description: ''
  /api/v1/orders/:
    get:
      operationId: v1_orders_list
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedOrderList'
          description: ''
  /api/v1/orders/{id}/:
    get:
      operationId: v1_orders_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
          description: ''
  /api/v1/ready/:
    get:
      operationId: v1_ready_retrieve
      tags:
      - v1
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
          description: ''
components:
  schemas:
    Address:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        company:
          type: string
          format: uuid
          nullable: true
        label:
          type: string
          maxLength: 100
        city:
          type: string
          maxLength: 100
        line:
          type: string
          maxLength: 500
        comment:
          type: string
          maxLength: 500
        is_default:
          type: boolean
      required:
      - id
      - label
      - line
    Category:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 255
        slug:
          type: string
          maxLength: 255
          pattern: ^[-a-zA-Z0-9_]+$
        parent:
          type: string
          format: uuid
          nullable: true
        sort_order:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
      required:
      - id
      - name
      - slug
    Checkout:
      type: object
      properties:
        company_id:
          type: string
          format: uuid
          nullable: true
        contact_name:
          type: string
          maxLength: 255
        contact_phone:
          type: string
          maxLength: 32
        contact_email:
          oneOf:
          - type: string
            format: email
          - type: string
            maxLength: 0
        delivery_method:
          allOf:
          - $ref: '#/components/schemas/DeliveryMethodEnum'
          default: delivery
        delivery_address:
          type: string
          maxLength: 500
        comment:
          type: string
          maxLength: 2000
        lines:
          type: array
          items:
            $ref: '#/components/schemas/CheckoutLine'
      required:
      - contact_name
      - contact_phone
      - lines
    CheckoutLine:
      type: object
      properties:
        variant_id:
          type: string
          format: uuid
        quantity:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,6})?$
      required:
      - quantity
      - variant_id
    Company:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 255
        bin:
          type: string
          title: БИН
          maxLength: 32
        role:
          nullable: true
          readOnly: true
          oneOf:
          - $ref: '#/components/schemas/RoleEnum'
          - $ref: '#/components/schemas/NullEnum'
        can_order:
          type: boolean
          readOnly: true
      required:
      - can_order
      - id
      - name
      - role
    Csrf:
      type: object
      properties:
        csrf_token:
          type: string
          readOnly: true
      required:
      - csrf_token
    DeliveryMethodEnum:
      enum:
      - delivery
      - pickup
      type: string
      description: |-
        * `delivery` - delivery
        * `pickup` - pickup
    Login:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      required:
      - email
      - password
    Media:
      type: object
      properties:
        url:
          type: string
          format: uri
          nullable: true
          readOnly: true
        alt_text:
          type: string
          maxLength: 255
        is_primary:
          type: boolean
      required:
      - url
    NullEnum:
      enum:
      - null
    Order:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        number:
          type: string
          maxLength: 32
        company:
          type: string
          format: uuid
          nullable: true
        status:
          $ref: '#/components/schemas/StatusEnum'
        pricing_state:
          $ref: '#/components/schemas/PricingStateEnum'
        currency:
          type: string
          maxLength: 3
        subtotal:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,4})?$
          nullable: true
        total:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,4})?$
          nullable: true
        contact_name:
          type: string
          maxLength: 255
        contact_phone:
          type: string
          maxLength: 32
        contact_email:
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        delivery_method:
          type: string
          maxLength: 32
        delivery_address:
          type: string
          maxLength: 500
        comment:
          type: string
        crm_external_id:
          type: string
          maxLength: 255
        created_at:
          type: string
          format: date-time
          readOnly: true
        lines:
          type: array
          items:
            $ref: '#/components/schemas/OrderLine'
      required:
      - contact_name
      - contact_phone
      - created_at
      - id
      - lines
      - number
    OrderLine:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        variant:
          type: string
          format: uuid
          nullable: true
        sku:
          type: string
          maxLength: 100
        title:
          type: string
          maxLength: 500
        unit:
          type: string
          maxLength: 32
        quantity:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,6})?$
        unit_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,4})?$
          nullable: true
        line_total:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,4})?$
          nullable: true
        currency:
          type: string
          maxLength: 3
        available_quantity:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,6})?$
          nullable: true
        availability:
          $ref: '#/components/schemas/OrderLineAvailabilityEnum'
        availability_checked_at:
          type: string
          format: date-time
          nullable: true
      required:
      - availability
      - id
      - quantity
      - title
      - unit
    OrderLineAvailabilityEnum:
      enum:
      - sufficient
      - insufficient
      - absent
      - unknown
      type: string
      description: |-
        * `sufficient` - В наличии
        * `insufficient` - Недостаточно
        * `absent` - Отсутствует
        * `unknown` - Не подтверждено
    PaginatedAddressList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Address'
    PaginatedOrderList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Order'
    PaginatedProductListList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/ProductList'
    PatchedAddress:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        company:
          type: string
          format: uuid
          nullable: true
        label:
          type: string
          maxLength: 100
        city:
          type: string
          maxLength: 100
        line:
          type: string
          maxLength: 500
        comment:
          type: string
          maxLength: 500
        is_default:
          type: boolean
    PricingStateEnum:
      enum:
      - final
      - needs_confirmation
      type: string
      description: |-
        * `final` - Рассчитан
        * `needs_confirmation` - Требует подтверждения
    ProductDetail:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        title:
          type: string
          maxLength: 500
        slug:
          type: string
          maxLength: 500
          pattern: ^[-a-zA-Z0-9_]+$
        brand:
          type: string
          maxLength: 255
        category:
          $ref: '#/components/schemas/Category'
        variants:
          type: array
          items:
            $ref: '#/components/schemas/Variant'
        description:
          type: string
        seo_title:
          type: string
          maxLength: 255
        seo_description:
          type: string
          maxLength: 500
        attributes: {}
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - category
      - id
      - slug
      - title
      - updated_at
      - variants
    ProductList:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        title:
          type: string
          maxLength: 500
        slug:
          type: string
          maxLength: 500
          pattern: ^[-a-zA-Z0-9_]+$
        brand:
          type: string
          maxLength: 255
        category:
          $ref: '#/components/schemas/Category'
        variants:
          type: array
          items:
            $ref: '#/components/schemas/Variant'
      required:
      - category
      - id
      - slug
      - title
      - variants
    Register:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          writeOnly: true
          minLength: 8
        first_name:
          type: string
          title: Имя
          maxLength: 150
        last_name:
          type: string
          title: Фамилия
          maxLength: 150
        phone:
          type: string
          maxLength: 32
      required:
      - email
      - password
    RoleEnum:
      enum:
      - owner
      - buyer
      - viewer
      type: string
      description: |-
        * `owner` - owner
        * `buyer` - buyer
        * `viewer` - viewer
    Status:
      type: object
      properties:
        status:
          type: string
      required:
      - status
    StatusEnum:
      enum:
      - new
      - queued
      - sent
      - needs_attention
      - cancelled
      type: string
      description: |-
        * `new` - Новый
        * `queued` - В очереди CRM
        * `sent` - Передан в CRM
        * `needs_attention` - Требует внимания
        * `cancelled` - Отменён
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          maxLength: 254
        first_name:
          type: string
          title: Имя
          maxLength: 150
        last_name:
          type: string
          title: Фамилия
          maxLength: 150
        phone:
          type: string
          maxLength: 32
        companies:
          type: array
          items:
            $ref: '#/components/schemas/Company'
          readOnly: true
      required:
      - companies
      - email
      - id
    Variant:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        sku:
          type: string
          maxLength: 100
        barcode:
          type: string
          maxLength: 100
        source_name:
          type: string
          maxLength: 500
        unit:
          type: string
          maxLength: 32
        package_label:
          type: string
          maxLength: 255
        package_qty:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,6})?$
        min_qty:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,6})?$
        qty_step:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,6})?$
        price:
          type: object
          additionalProperties: {}
          readOnly: true
        stock:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,6})?$
          nullable: true
          readOnly: true
        availability:
          allOf:
          - $ref: '#/components/schemas/VariantAvailabilityEnum'
          readOnly: true
        images:
          type: array
          items:
            $ref: '#/components/schemas/Media'
      required:
      - availability
      - id
      - images
      - price
      - source_name
      - stock
    VariantAvailabilityEnum:
      enum:
      - sufficient
      - insufficient
      - absent
      - unknown
      type: string
      description: |-
        * `sufficient` - sufficient
        * `insufficient` - insufficient
        * `absent` - absent
        * `unknown` - unknown
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
