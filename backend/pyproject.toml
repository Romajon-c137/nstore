[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
addopts = "-q --disable-warnings --strict-markers"

[tool.ruff]
target-version = "py313"
line-length = 140
exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]
