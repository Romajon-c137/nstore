upstream nstore_backend {
    server web:8000;
    keepalive 16;
}

limit_req_zone $binary_remote_addr zone=nstore_api:10m rate=10r/s;

server {
    listen 80;
    server_name _;
    client_max_body_size 12m;

    location /api/ {
        limit_req zone=nstore_api burst=30 nodelay;
        proxy_pass http://nstore_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 45s;
    }

    location /admin/ { proxy_pass http://nstore_backend; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
    location /static/ { alias /srv/static/; expires 30d; add_header Cache-Control "public, immutable"; }
    location /media/ { alias /srv/media/; expires 7d; add_header Cache-Control "public"; }
    location / { return 404; }
}
