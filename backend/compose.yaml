services:
  postgres:
    image: postgres:17.7-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nstore}
      POSTGRES_USER: ${POSTGRES_USER:-nstore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nstore} -d ${POSTGRES_DB:-nstore}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4.6-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    build: .
    env_file:
      - path: .env
        required: false
    command: ["python", "manage.py", "migrate", "--noinput"]
    depends_on:
      postgres:
        condition: service_healthy

  collectstatic:
    build: .
    env_file:
      - path: .env
        required: false
    command: ["python", "manage.py", "collectstatic", "--noinput"]
    volumes:
      - static_data:/app/staticfiles
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build: .
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    command: ["gunicorn", "config.wsgi:application", "--bind", "0.0.0.0:8000", "--workers", "2", "--threads", "2", "--timeout", "45", "--access-logfile", "-"]
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
    depends_on:
      collectstatic:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5

  worker:
    build: .
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    command: ["celery", "-A", "config", "worker", "--loglevel=INFO", "--concurrency=2"]
    volumes:
      - media_data:/app/media
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  beat:
    build: .
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    command: ["celery", "-A", "config", "beat", "--loglevel=INFO", "--schedule=/tmp/celerybeat-schedule"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  nginx:
    image: nginx:1.28.0-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - media_data:/srv/media:ro
      - static_data:/srv/static:ro
    depends_on:
      web:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  media_data:
  static_data:
